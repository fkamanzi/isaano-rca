modules:
  jira:issuePanel:
    - key: isaano-rca-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Isaano RCA (evidence-locked)
      icon: resource:static;icon.svg

  rovo:agent:
    - key: isaano-rca-agent
      name: Isaano RCA Investigator
      description: Builds evidence-locked root-cause analyses for incidents in Jira Service Management. Every cause it states cites the evidence behind it.
      prompt: |
        You are Isaano RCA Investigator, a root-cause analyst for telecom and IT incidents tracked in Jira Service Management.

        Rules you always follow:
        1. Work only from what your actions return: the ticket timeline and the incident's evidence register. Never state a cause, time, figure or system name that is not in them.
        2. After every factual statement about the incident, cite the evidence IDs in brackets, for example [E3]. Ticket events need no ID.
        3. Before you discuss causes, call get-incident-timeline and list-evidence for the incident.
        4. Start from the first deviation that list-evidence reports and analyse that network segment first; later segments carry the symptom until evidence shows otherwise. If it reports a tie, say the order cannot be proven at that time granularity and recommend checking shared resources first: transport aggregation, synchronisation, DNS, subscriber databases, signalling routing and site power.
        5. A finding is Proven only when its evidence shows a deviation and a counterfactual is recorded (what changed when the cause was removed). Otherwise it is Supported (evidence, no counterfactual) or Unproven (a hypothesis).
        6. When evidence is missing, ask for the exact item: what it is, from which system, for which time window in UTC.
        7. Add or update evidence and findings only when the user asks you to, and repeat the values back before calling add-evidence, add-finding or update-finding.
        8. Before you call an RCA ready, call check-evidence-lock and list any blocking items.
        9. Use draft-rca to produce the report, and keep its section numbering.

        Be brief and specific. Use UTC times.
      conversationStarters:
        - Build the timeline for this incident
        - Which network segment deviated first?
        - Is this RCA ready to publish?
        - Draft the RCA report
      actions:
        - get-incident-timeline
        - list-evidence
        - check-evidence-lock
        - draft-rca
        - add-evidence
        - add-finding
        - update-finding

  action:
    - key: get-incident-timeline
      name: Get incident timeline
      function: action
      actionVerb: GET
      description: Returns the incident's timeline in UTC (ticket events and evidence) and its response and restore times.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: The incident's Jira issue key, for example INC-12. Leave empty to use the issue in context.
    - key: list-evidence
      name: List evidence and findings
      function: action
      actionVerb: GET
      description: Returns the incident's evidence register, findings, corrective actions and the first deviating network segment.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: The incident's Jira issue key. Leave empty to use the issue in context.
    - key: check-evidence-lock
      name: Check the evidence lock
      function: action
      actionVerb: GET
      description: Checks whether the RCA can be published - every cause cites existing evidence, Proven findings show a deviation and a counterfactual, actions have owners and dates - and lists blocking items and warnings.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: The incident's Jira issue key. Leave empty to use the issue in context.
    - key: draft-rca
      name: Draft the RCA report
      function: action
      actionVerb: GET
      description: Returns the RCA report in Markdown - summary, timing, timeline, first deviation, root cause with evidence citations, contributing factors, excluded hypotheses, corrective actions, evidence register and open items.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: The incident's Jira issue key. Leave empty to use the issue in context.
    - key: add-evidence
      name: Add evidence
      function: action
      actionVerb: CREATE
      description: Adds an evidence item (alarm, KPI, log, trace, change record or field report) to the incident's evidence register.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: The incident's Jira issue key. Leave empty to use the issue in context.
        type:
          title: Type
          type: string
          required: true
          description: "One of: alarm, kpi, log, trace, change, field."
        segment:
          title: Network segment
          type: string
          required: true
          description: "One of: RAN, Transport, Core, IMS / voice, Services, Cloud, Site power, Other."
        source:
          title: Source
          type: string
          required: true
          description: The system or network element the evidence comes from.
        at:
          title: Time (UTC)
          type: string
          required: true
          description: When the evidence was observed, in UTC, for example 2026-11-17T08:42:00Z.
        summary:
          title: What it shows
          type: string
          required: true
          description: What the evidence shows, with values where there are values.
        abnormal:
          title: Shows a deviation
          type: boolean
          required: true
          description: True when the evidence shows abnormal behaviour.
    - key: add-finding
      name: Add a finding
      function: action
      actionVerb: CREATE
      description: Adds a root cause, contributing factor or excluded hypothesis that cites evidence IDs.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: The incident's Jira issue key. Leave empty to use the issue in context.
        kind:
          title: Kind
          type: string
          required: true
          description: "One of: cause, contributing, excluded."
        text:
          title: Finding
          type: string
          required: true
          description: The finding in one sentence.
        confidence:
          title: Confidence
          type: string
          required: true
          description: "One of: Proven, Supported, Unproven."
        evidence:
          title: Evidence IDs
          type: string
          required: false
          description: Comma-separated evidence IDs, for example E1, E3.
        counterfactual:
          title: Counterfactual
          type: string
          required: false
          description: What changed when the cause was removed; required for Proven.

    - key: update-finding
      name: Update a finding
      function: action
      actionVerb: UPDATE
      description: Updates a finding as evidence arrives - its confidence, the evidence IDs it cites or its counterfactual.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: The incident's Jira issue key. Leave empty to use the issue in context.
        id:
          title: Finding ID
          type: string
          required: true
          description: The finding to update, for example F1.
        confidence:
          title: Confidence
          type: string
          required: false
          description: "One of: Proven, Supported, Unproven."
        evidence:
          title: Evidence IDs
          type: string
          required: false
          description: Comma-separated evidence IDs that replace the current ones.
        counterfactual:
          title: Counterfactual
          type: string
          required: false
          description: What changed when the cause was removed; required for Proven.

  rovo:mcp:
    - key: isaano-rca-mcp
      name: Isaano RCA
      tools:
        - get-incident-timeline
        - list-evidence
        - check-evidence-lock
        - draft-rca

  function:
    - key: resolver
      handler: index.handler
    - key: action
      handler: index.runAction

resources:
  - key: main
    path: src/frontend/index.jsx
  - key: static
    path: static

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/3237f9f0-5ec4-4f9c-942b-04592ea62b58
